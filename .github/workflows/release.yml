name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create or update (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: jsql-linux-x64
          - runner: ubuntu-24.04-arm
            target: jsql-linux-arm64
          - runner: macos-15-intel
            target: jsql-macos-x64
          - runner: macos-15
            target: jsql-macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate tag
        run: git check-ref-format "refs/tags/$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
      - name: Package binary
        run: COPYFILE_DISABLE=1 tar -czf "$TARGET.tar.gz" -C dist jsql
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: jsql-*
          merge-multiple: true
          path: assets
      - name: Create or update tag
        run: git push origin "+$GITHUB_SHA:refs/tags/$TAG"
      - name: Create or update release
        working-directory: assets
        run: |
          sha256sum jsql-*.tar.gz > SHA256SUMS
          if gh release view -- "$TAG" > /dev/null 2>&1; then
            gh release upload --clobber -- "$TAG" jsql-*.tar.gz SHA256SUMS
            gh release edit --draft=false --target "$GITHUB_SHA" -- "$TAG"
          else
            gh release create --verify-tag --generate-notes --title "$TAG" \
              --target "$GITHUB_SHA" -- "$TAG" jsql-*.tar.gz SHA256SUMS
          fi
